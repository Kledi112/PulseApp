services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: perx
      POSTGRES_PASSWORD: perx
      POSTGRES_DB: perx
    ports:
      - "5434:5432"
    volumes:
      - perx_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perx"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  perx_postgres_data:
